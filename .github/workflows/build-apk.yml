name: Compilar APK de prueba

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Completar andamiaje Android
        run: |
          flutter create --org pe.samai --project-name samai --platforms android .
          rm -f test/widget_test.dart   # prueba de ejemplo de la app contador
          python3 tool/patch_android.py
          grep -nE "minSdk|signingConfig" android/app/build.gradle.kts

      - name: Dependencias
        run: flutter pub get

      - name: Pruebas
        run: flutter test

      - name: Análisis estático (errores de Dart)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1 || true
          grep -E "error •|warning •" analyze.log | head -40 | sed 's/^/::warning::/' || true

      - name: Compilar APK (debug, incluye modo demo Premium)
        shell: bash
        run: |
          set +e
          flutter build apk --debug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -E "Error|error:|e: |What went wrong|> |FAILURE|Exception" build.log | grep -v "^\s*$" | tail -40 | sed 's/^/::error::/'
          fi
          exit $code

      - name: Publicar APK para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SAMAI prueba ${{ github.run_number }}
          prerelease: true
          files: build/app/outputs/flutter-apk/app-debug.apk
